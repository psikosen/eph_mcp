[project]
name = "eph-mcp"
version = "0.1.0"
description = "Emergent Pattern Hunter - A revolutionary thinking MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "pydantic>=2.0.0",
    "asyncio>=3.4.3",
    "uvloop>=0.17.0",
    "faiss-cpu>=1.7.4",
    "textstat>=0.7.3",
    "spacy>=3.5.0",
    "pandas>=2.0.0",
]

[project.scripts]
eph-mcp = "eph_mcp.server:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
